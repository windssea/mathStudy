<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img"><rect width="720" height="340" fill="white"/><g font-family="system-ui, sans-serif"><text x="30" y="35" font-size="22" text-anchor="start" fill="#243754">万位多1、千位少1的差值</text><text x="28" y="95" font-size="18" text-anchor="start" fill="#243754">万位</text><rect x="150" y="70" width="490" height="38" fill="#dce7ff" stroke="#7c98d2" stroke-width="1.5"/><text x="395" y="96" font-size="18" text-anchor="middle" fill="#243754">10000</text><text x="28" y="165" font-size="18" text-anchor="start" fill="#243754">千位</text><rect x="150" y="140" width="49" height="38" fill="#dce7ff" stroke="#7c98d2" stroke-width="1.5"/><text x="174.5" y="132" font-size="16" text-anchor="middle" fill="#243754">1000</text><rect x="25" y="286" width="670" height="43" fill="#f5f7fb" stroke="#7c98d2" stroke-width="1.5"/><text x="42" y="314" font-size="19" text-anchor="start" fill="#243754">每相差1，交换前后相差10000−1000＝9000</text></g></svg>
