<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img"><rect width="720" height="340" fill="white"/><g font-family="system-ui, sans-serif"><text x="30" y="35" font-size="22" text-anchor="start" fill="#243754">分别算每种材料的容量</text><rect x="35" y="62" width="162.5" height="42" fill="#e6eeff" stroke="#7c98d2" stroke-width="1.5"/><text x="116.25" y="89" font-size="18" text-anchor="middle" fill="#243754">材料</text><rect x="197.5" y="62" width="162.5" height="42" fill="#e6eeff" stroke="#7c98d2" stroke-width="1.5"/><text x="278.75" y="89" font-size="18" text-anchor="middle" fill="#243754">总数</text><rect x="360" y="62" width="162.5" height="42" fill="#e6eeff" stroke="#7c98d2" stroke-width="1.5"/><text x="441.25" y="89" font-size="18" text-anchor="middle" fill="#243754">每套用</text><rect x="522.5" y="62" width="162.5" height="42" fill="#e6eeff" stroke="#7c98d2" stroke-width="1.5"/><text x="603.75" y="89" font-size="18" text-anchor="middle" fill="#243754">可供</text><rect x="35" y="104" width="162.5" height="43" fill="#fff" stroke="#7c98d2" stroke-width="1.5"/><text x="116.25" y="132" font-size="18" text-anchor="middle" fill="#243754">乒乓球</text><rect x="197.5" y="104" width="162.5" height="43" fill="#fff" stroke="#7c98d2" stroke-width="1.5"/><text x="278.75" y="132" font-size="18" text-anchor="middle" fill="#243754">96个</text><rect x="360" y="104" width="162.5" height="43" fill="#fff" stroke="#7c98d2" stroke-width="1.5"/><text x="441.25" y="132" font-size="18" text-anchor="middle" fill="#243754">3个</text><rect x="522.5" y="104" width="162.5" height="43" fill="#fff" stroke="#7c98d2" stroke-width="1.5"/><text x="603.75" y="132" font-size="18" text-anchor="middle" fill="#243754">32套</text><rect x="35" y="147" width="162.5" height="43" fill="#fff" stroke="#7c98d2" stroke-width="1.5"/><text x="116.25" y="175" font-size="18" text-anchor="middle" fill="#243754">羽毛球</text><rect x="197.5" y="147" width="162.5" height="43" fill="#fff" stroke="#7c98d2" stroke-width="1.5"/><text